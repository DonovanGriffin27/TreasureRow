Description of file (What it does, how it is used, etc):
This file holds the main UI strucutre for the storefront homepage of the Vault. It includes the top navigation bar, logo and search section, 
and the main content area where storefront cards will be displayed. The storefront cards are generated dynamically using storefront.js. This page serves as the entry point for users to explore different storefronts available on the website.
It is simply the skeleton/template of the storefront page, all styling is handled by storefront.css
The cards are not hardcoded into HTML, but there is a grid container that the javascript file added dynamically as users create storefronts.
This page will connect to the Flask backend and database by requesting storefront data from the created API routes and displaying them once created.

Purpose simplified: Creates page structure:
Top bar: menu button on left, cart and profile icons on right
Logo/Title and search section: The Vault logo/title and a search bar for users to search for storefronts
Main content: where storefront cards will be displayed, along with pagination controls at bottom of page
Script connection: Links and loads JS file that actually creates the storefront cards dynamically





Start of Code w/ comments
--->

<!DOCTYPE html> 
<!-- needed for any HTML file -->

<html lang="en"> 
<!-- This line tells the browser that all content on the page is in english. There arent any other language considerations at the moment -->

<head> 
<!-- stores info that isnt actually shown on the page itself. Includes metadata, browser tab title, and links to the css file -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- ensures the screensize is consistent on different types of devices -->
  <title>Treasure Row | Storefronts</title> <!-- Simple, this is the Title of the page -->

    <link rel="stylesheet" href="{{ url_for('static', filename='css/storefront.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
</head> <!-- end of head -->



<!-- MAIN "BODY" CODE: This section holds what will actually be seen and interacted with on the storefront page -->

<body class="tr-app">

<!-- Old side nav, top bar, and logo/search section replaced by the shared
     header (partials/_app_header.html) and the toolbar below.
     Redesigned by Donovan Griffin, Iteration 3. -->
  {% set tr_title = "Storefronts" %}
  {% set tr_subtitle = "Shop student-run brands from across Hampton's campus." %}
  {% include "partials/_app_header.html" %}

<!-- Main page content: Holds the storefrotn cards and pagination -->
  <main class="page-content tr-main">

    <div class="tr-toolbar">
      <h2>All Storefronts</h2>
      <!-- search bar: storefront.js filters cards as the user types -->
      <input
        type="text"
        id="searchInput"
        class="tr-search"
        placeholder="Search storefronts"
        aria-label="Search storefronts"
      />
    </div>


    <section class="storefront-grid" id="storefrontGrid">
    </section>

    <!-- Page controls that live at the bottom of the page under the grids where users can go back and forth from page to page. 
     Currently only placeholders as page buttons are not functional-->
    <div class="pagination">
      <button class="page-btn">Previous</button> <!-- Previous button -->
      <span class="page-indicator">Page 1</span> <!-- displays page number  -->
      <button class="page-btn">Next</button> <!-- Next button -->
    </div> <!-- end pagination class -->

  </main> <!-- end of main page content -->

  <!-- Lightbox overlay - Added 4/20/26 -->
  <div id="lightboxOverlay" class="lightbox-overlay">
    <img id="lightboxImg" class="lightbox-img" src="" alt="Preview">
  </div>

  <script src="{{ url_for('static', filename='js/safe_html.js') }}"></script>
  <script src="{{ url_for('static', filename='js/storefront.js') }}"></script>
  <!-- This line links this file to storefront.js 
   Placed at the bottom so that all HTML loads correctly first and then JS. This ensures everything runs correctly -->
</body> <!-- end of body -->
</html>
