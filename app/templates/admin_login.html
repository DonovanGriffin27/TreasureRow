<!-- Admin Login Page - Created 4/18/26 -->
<!-- Redesigned for Treasure Row (HamptonU Experience style) by Donovan Griffin, Iteration 3 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Row | Admin Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="tr-app">
    <main class="tr-auth">
        <div class="tr-auth-card is-admin">
            <img src="/static/images/logo.png" alt="Treasure Row logo" class="tr-auth-logo">
            <h1>Administrator sign in</h1>
            <p class="tr-auth-sub">Restricted to Treasure Row admins</p>

            {% if error %}
                <div class="tr-flash tr-flash--error" role="alert">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('auth.admin_login') }}" method="POST">
                <div class="tr-field">
                    <label for="username">Admin username</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" required autocomplete="username" autofocus>
                </div>
                <div class="tr-field">
                    <label for="password">Admin password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="tr-btn">Sign In</button>
            </form>

            <div class="tr-auth-links">
                <a href="{{ url_for('auth.login') }}">← Student sign in</a>
                <a href="{{ url_for('index') }}">Home</a>
            </div>
        </div>
    </main>
</body>
</html>
