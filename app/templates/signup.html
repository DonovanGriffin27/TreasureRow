<!-- Redesigned for Treasure Row (HamptonU Experience style) by Donovan Griffin, Iteration 3 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Row | Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="tr-app">
    <main class="tr-auth">
        <div class="tr-auth-card">
            <img src="/static/images/logo.png" alt="Treasure Row logo" class="tr-auth-logo">
            <h1>Create your account</h1>
            <p class="tr-auth-sub">Buy and sell with students across Hampton's campus</p>

            {% if error %}
                <div class="tr-flash tr-flash--error" role="alert">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('auth.signup') }}" method="POST">
                <div class="tr-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" required autocomplete="username" autofocus>
                </div>
                <div class="tr-field">
                    <label for="email">Hampton email</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="first.last@my.hamptonu.edu" autocomplete="email">
                </div>
                <div class="tr-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>
                <button type="submit" class="tr-btn">Create Account</button>
            </form>

            <div class="tr-auth-links">
                <a href="{{ url_for('index') }}">← Back</a>
                <a href="{{ url_for('auth.login') }}">Already have an account?</a>
            </div>
        </div>
    </main>
</body>
</html>
