<!-- Redesigned for Treasure Row (HamptonU Experience style) by Donovan Griffin, Iteration 3 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Row | Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="tr-app">
    <main class="tr-auth">
        <div class="tr-auth-card">
            <img src="/static/images/logo.png" alt="Treasure Row logo" class="tr-auth-logo">
            <h1>Welcome back</h1>
            <p class="tr-auth-sub">Sign in to Treasure Row</p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="tr-flash">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            {% if error %}
                <div class="tr-flash tr-flash--error" role="alert">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="tr-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" required autocomplete="username" autofocus>
                </div>
                <div class="tr-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="tr-btn">Sign In</button>
            </form>

            <div class="tr-auth-links">
                <a href="{{ url_for('index') }}">← Back</a>
                <a href="{{ url_for('auth.signup') }}">Create an account</a>
            </div>

            <!-- Admin Login link added 4/20/26 -->
            <div class="tr-auth-foot">
                <a href="{{ url_for('auth.admin_login') }}">Administrator sign in</a>
            </div>
        </div>
    </main>
</body>
</html>
