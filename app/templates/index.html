<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Row | Hampton University Marketplace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="tr-app">
    <main class="tr-landing">
        <section class="tr-landing-card">
            <img src="/static/images/logo.png" alt="Treasure Row logo" class="tr-portal-logo">
            <h1>Treasure Row</h1>
            <p class="tr-landing-tagline">Hampton University's student fashion marketplace</p>

            <div class="tr-landing-actions">
                <a href="{{ url_for('auth.login') }}" class="tr-btn">Sign In</a>
                <a href="{{ url_for('auth.signup') }}" class="tr-btn tr-btn--crimson">Create Account</a>
            </div>

            <p class="tr-landing-note">Sign in with your Treasure Row account to browse and sell.</p>
        </section>
    </main>
</body>
</html>
