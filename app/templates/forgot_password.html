<!-- Forgot password page - Donovan Griffin, Iteration 4 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Row | Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="tr-app">
    <main class="tr-auth">
        <div class="tr-auth-card">
            <img src="/static/images/logo.png" alt="Treasure Row logo" class="tr-auth-logo">
            <h1>Forgot your password?</h1>
            <p class="tr-auth-sub">Enter your Hampton email and we'll send you a link to reset it.</p>

            <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                <div class="tr-field">
                    <label for="email">Hampton email</label>
                    <input type="email" id="email" name="email" required placeholder="first.last@my.hamptonu.edu" autocomplete="email" autofocus>
                </div>
                <button type="submit" class="tr-btn">Send Reset Link</button>
            </form>

            <div class="tr-auth-links">
                <a href="{{ url_for('auth.login') }}">← Back to sign in</a>
                <a href="{{ url_for('auth.signup') }}">Create an account</a>
            </div>
        </div>
    </main>
</body>
</html>
